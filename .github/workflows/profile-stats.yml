name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create profile image directory
        run: mkdir -p profile

      - name: Generate profile stats, languages and achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          base: header, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_achievements: yes
          plugin_achievements_display: compact
          output_action: none

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/contribution-calendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          output_action: none

      - name: Generate recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/recent-activity.svg
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          output_action: none

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=090909&stroke=c6a36a&ring=c6a36a&fire=c6a36a&currStreakLabel=c6a36a
          path: profile/streak.svg

      - name: Commit all generated images together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.svg profile/streak.svg profile/contribution-calendar.svg profile/recent-activity.svg
          git diff --cached --quiet || (git commit -m "Update profile overview images" && git push)
